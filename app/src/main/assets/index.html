<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Androws 11</title><style>
:root{--glass:rgba(18,43,91,.65);--accent:#54baff;--text:#fff}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 75% 20%,#0e8cff 0%,transparent 37%),radial-gradient(ellipse at 20% 75%,#003aab,transparent 55%),linear-gradient(130deg,#061530,#091b65 65%,#010923);min-height:100dvh}main{padding:35px 17px 110px}.glass{background:var(--glass);border:1px solid #ffffff55;border-radius:22px;backdrop-filter:blur(16px);box-shadow:0 10px 24px #0003;padding:18px}.hero{margin:16px 0 18px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600}.logo{font-size:42px;color:#54baff}.subtitle{font-size:12px;opacity:.8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:0;border-radius:15px;background:#ffffff17;color:white;padding:14px 3px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:12px}.tile .emoji{font-size:27px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}h2{font-size:18px;margin:0}.widget{display:flex;justify-content:space-between;align-items:center}.clock{font-size:33px;font-weight:600}.dock{position:fixed;bottom:12px;left:12px;right:12px;border-radius:22px;background:#193e80df;border:1px solid #ffffff66;backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:13px 7px}.dock button{background:none;color:white;border:0;font-size:26px}#start{display:none;position:fixed;inset:7% 10px 80px;background:#102a55f2;border:1px solid #ffffff55;border-radius:25px;padding:19px;overflow:auto;box-shadow:0 10px 50px #0009}#start.show{display:block}input{width:100%;padding:14px;border-radius:12px;border:1px solid #a6cfff;background:#ffffff20;color:white;font-size:16px}input::placeholder{color:#ddd}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.app{word-break:break-word;font-size:12px}.small{font-size:13px;opacity:.8}button{cursor:pointer}
</style></head><body><main><div class="hero glass"><span class="logo">⊞</span><div>Androws 11<div class="subtitle">ROCARDAN SYSTEMS · Mobile Edition</div></div></div><div class="glass widget"><div><div class="small" id="date"></div><div class="clock" id="time"></div><div class="small">Seu espaço, seu estilo.</div></div><div style="font-size:52px">☀️</div></div><div class="section"><h2>Fixados</h2><span class="small" onclick="showStart()">Todos os apps ›</span></div><div class="glass grid" id="pinned"></div><div class="section"><h2>Personalização</h2></div><div class="glass"><div>Cor de destaque</div><div style="display:flex;gap:12px;margin-top:14px"><button class="tile" style="background:#167de5;min-height:48px;flex:1" onclick="accent('#54baff')">Azul</button><button class="tile" style="background:#9141b8;min-height:48px;flex:1" onclick="accent('#c18aff')">Roxo</button><button class="tile" style="background:#007d68;min-height:48px;flex:1" onclick="accent('#65efc7')">Verde</button></div></div></main><div class="dock"><button onclick="showStart()">⊞</button><button onclick="showStart()">⌕</button><button onclick="Android.openSettings()">⚙</button><button onclick="showStart()">▦</button></div><div id="start"><div class="section"><h2>Iniciar</h2><button class="tile" style="min-height:35px" onclick="closeStart()">✕</button></div><input id="search" placeholder="Pesquisar aplicativos..." oninput="renderApps()"><div class="apps" id="apps"></div></div><script>
let all=[];try{all=JSON.parse(Android.apps())}catch(e){all=[{name:'Exemplo',package:'demo'}]};const emojis=['🌐','📷','💬','🎵','📁','📅','✉️','🧭','📱'];function icon(a,i){return `<button class="tile app" data-pkg="${a.package.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"><span class="emoji">${emojis[i%emojis.length]}</span>${a.name.replaceAll('&','&amp;').replaceAll('<','&lt;')}</button>`}function bind(el){el.querySelectorAll('[data-pkg]').forEach(b=>b.onclick=()=>Android.launch(b.dataset.pkg))}function renderApps(){const q=document.getElementById('search').value.toLowerCase();const e=document.getElementById('apps');e.innerHTML=all.filter(a=>a.name.toLowerCase().includes(q)).map(icon).join('');bind(e)}function showStart(){document.getElementById('start').classList.add('show');renderApps()}function closeStart(){document.getElementById('start').classList.remove('show')}function accent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('accent',c)}accent(localStorage.getItem('accent')||'#54baff');let p=document.getElementById('pinned');p.innerHTML=all.slice(0,9).map(icon).join('');bind(p);function tick(){let d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});document.getElementById('time').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,15000);
</script></body></html>
